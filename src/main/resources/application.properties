spring.application.name=api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:*}
alpha.vantage.key=${ALPHA_VANTAGE_KEY}
spring.task.scheduling.pool.size=5

# Google Cloud Storage. Use Application Default Credentials on the API host.
app.storage.enabled=${GCS_ENABLED:false}
app.storage.project-id=${GCS_PROJECT_ID}
app.storage.bucket=${GCS_BUCKET:centoroenterprise}

# Brevo transactional email and SMS.
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL}
app.brevo.sender-name=${BREVO_SENDER_NAME}
app.brevo.sms-sender=${BREVO_SMS_SENDER:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.centoro.api=DEBUG

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Transaction
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.transaction.default-timeout=30

# ============================================================
# FLYWAY CONFIGURATION
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial Database
